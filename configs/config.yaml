portfolio:
  name: "Sample Multi-Asset Portfolio"
  currency: USD
  benchmark: SPY

data:
  holdings_path: "data/samples/portfolio_holdings.csv"
  raw_dir: "data/raw"
  interim_dir: "data/interim"
  processed_dir: "data/processed"
  price_start_date: "2024-01-01"
  price_end_date: null  # null = today

factors:
  dataset: "F-F_Research_Data_Factors_daily"
  factors: ["Mkt-RF", "SMB", "HML"]

analytics:
  risk_free_annual: 0.05
  var_confidence: 0.95
  var_horizon_days: 1
  trading_days_year: 252
  rolling_window_days: 63  # ~3 months

reporting:
  report_dir: "artifacts/reports"
  figures_dir: "artifacts/figures"
  log_dir: "artifacts/logs"
  report_format: "html"  # html, markdown, pdf

database:
  path: "data/portfolio.db"
  echo: false

